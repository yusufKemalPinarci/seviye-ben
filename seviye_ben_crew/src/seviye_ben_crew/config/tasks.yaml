design_economy_task:
  description: >
    SeviyeBen sprint tasarımı. API / canlı servis yok.

    Sprint: {sprint_id} ({sprint_code})
    Konu: {topic}
    Yıl: {current_year}
    Kabul (ROADMAP): {acceptance}

    Şunları netleştir (yalnızca bu sprint için):
    1) Oyun / ürün kuralları ve denge sayıları
    2) Mevcut ekonomiyle uyum veya migration notu
    3) Edge case’ler
    4) Kod’a kısa not (hangi alanlar etkilenir)

    Habitica isim/mekanik kopyalama. Online özellik önerme.
    Çıktı Flutter’a gömülebilecek kadar somut olsun. Türkçe.
  expected_output: >
    Markdown ekonomi/tasarım: hedef, kurallar, tablolar, edge case,
    kabul checklist, kod’a not. Dosya adı ipucu: {output_ekonomi}
  agent: game_designer
  output_file: output/{output_ekonomi}

write_content_task:
  description: >
    Önceki ekonomi/tasarım çıktısına dayanarak sprint {sprint_id}
    ({sprint_code}) içeriğini yaz. Konu: {topic}.

    - Kullanıcıya görünen tüm UI metinleri (Türkçe)
    - Gerekirse kopyalanabilir JSON blokları
    - Asset yolu önerisi (seviye_ben/assets/content/...)

    Dil: Türkçe, sokak seviye atlama teması. Online özellik yok.
    Habitica marka/karakter yok.
  expected_output: >
    Markdown içerik + gerekirse JSON. Dosya: {output_icerik}
  agent: content_writer
  output_file: output/{output_icerik}

flutter_plan_task:
  description: >
    Üretilen ekonomi ve içeriği `seviye_ben` Flutter projesine nasıl
    gömeceğimizi planla. Sprint {sprint_id} ({sprint_code}).
    Konu: {topic}. Kabul: {acceptance}.

    Zorunlu stack: Riverpod, Hive, MVVM.
    Klasör: models / viewmodels / views/screens / views/widgets / services / utils.
    API/auth önerme. Tek sprintte uygulanabilir dosya listesi ver.
  expected_output: >
    Uygulama planı markdown: dosya listesi, model/state, UI akışı,
    test, uygulama sırası. Dosya: {output_plan}
  agent: flutter_architect
  output_file: output/{output_plan}
