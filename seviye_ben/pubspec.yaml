name: seviye_ben
description: SeviyeBen — ofline RPG alışkanlık uygulaması
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  flutter_native_splash: ^2.4.6
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.5.1
  audioplayers: ^6.7.1
  share_plus: ^11.0.0
  file_picker: ^8.3.7
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/content/seviye_ben_content.json
    - assets/branding/
    - assets/sfx/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#2E4A3E"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#2E4A3E"
  image: assets/branding/splash_logo.png
  android_12:
    color: "#2E4A3E"
    image: assets/branding/splash_logo.png
  ios: true
  web: false
